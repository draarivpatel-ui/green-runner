stages:
  - build
  - test
  - security
  - fuzz
  - deploy

install-build:
  stage: build
  tags:
    - saas-linux-large-amd64
  script:
    - npm ci
    - npm run build

unit-test:
  stage: test
  tags:
    - saas-linux-large-amd64
  script:
    - npm test

lint:
  stage: test
  tags:
    - saas-linux-medium-amd64
  script:
    - npm run lint

sast:
  stage: security
  tags:
    - saas-linux-medium-amd64
  script:
    - echo run sast

container_scanning:
  stage: security
  tags:
    - saas-linux-large-amd64
  script:
    - echo scan image

fuzz-api:
  stage: fuzz
  tags:
    - saas-linux-xlarge-amd64
  script:
    - echo fuzz the api for 30 minutes

deploy-staging:
  stage: deploy
  tags:
    - saas-linux-small-amd64
  script:
    - echo deploy to staging
